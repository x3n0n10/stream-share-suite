name: CD

on:
  push:
    tags:
      - 'v*'

# Least privilege by default. The test job runs npm lifecycle scripts from the
# whole dependency tree and needs no write scope; publish opts in below.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  publish:
    name: Publish image and release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GITHUB_TOKEN is minted per job; no PAT is needed. The job's
          # packages: write permission is what lets it push to GHCR.
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.0.0 -> 1.0.0, 1.0, 1 and latest. A pre-release tag such as
      # v1.0.0-rc.1 -> only 1.0.0-rc.1: the action skips the major/minor
      # aliases and latest for pre-releases on its own. It also sets the OCI
      # labels (including image.source), which link the package to this repo.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/x3n0n10/stream-share-suite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run after a partial failure finds the Release already made.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            $flags
