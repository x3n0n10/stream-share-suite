services:
  suite:
    build: .
    # Or use a published image once one exists:
    #   image: ghcr.io/x3n0n10/stream-share-suite:latest
    container_name: stream-share-suite
    restart: unless-stopped

    ports:
      # The UI. Change the left-hand side if 3000 is taken on your host.
      - "3000:3000"

    environment:
      PORT: 3000

      # Ownership of the data directory. The entrypoint starts as root, chowns
      # the volume to these ids, then runs the app as them — which is what makes
      # a bind-mounted directory work regardless of who owns it on the host.
      #   Unraid:            PUID=99  PGID=100   (nobody:users)
      #   Most other hosts:  PUID=1000 PGID=1000 (the default)
      PUID: 1000
      PGID: 1000

      # Where the SQLite store lives. Back this path up and you have backed up
      # the Suite's entire configuration.
      SUITE_DATA_DIR: /data

      # --- First-run import (optional) -------------------------------------
      # If you are coming from stream-share-dashboard, paste its INSTANCE_N_*
      # and GLUETUN_* variables here for the first boot. They are copied into
      # the database once and then ignored forever: after the import the store
      # is the source of truth, so an env var left behind here can never
      # silently override an edit made in the UI. Once it has run, delete them.
      #
      # INSTANCE_1_NAME: "Provider 1"
      # INSTANCE_1_URL: "http://172.18.0.11:8080"
      # INSTANCE_1_API_KEY: ""
      # GLUETUN_URL: "http://172.18.0.11:8000"
      # GLUETUN_USER: "admin"
      # GLUETUN_PASSWORD: ""

    volumes:
      - suite_data:/data
      # Or a bind mount, which is where PUID/PGID earns its keep:
      # - /mnt/user/appdata/stream-share-suite:/data

volumes:
  suite_data:

# ---------------------------------------------------------------------------
# Networking
#
# Standalone (as written above) the Suite sits on this compose project's own
# default network and reaches nothing else — fine for a first look at the UI,
# but it cannot see your instances.
#
# To point it at a real stack it needs to reach gluetun, because the instances
# live inside gluetun's network namespace and publish their ports on gluetun's
# address rather than their own. Attach it to the network gluetun is on, and
# address the instances there — `http://172.18.0.11:8080`, not `localhost`.
#
# It needs TWO networks, and the second one is easy to miss: an `internal: true`
# network has no route in or out, so a container attached only to it cannot
# publish a usable port — you would not be able to open the UI. Keep the default
# network for that (and, from phase 4, for reaching the image registries), and
# add the internal one for talking to the stack.
#
#   services:
#     suite:
#       networks:
#         - default     # published port + outbound
#         - ssbackend   # reaching gluetun and, later, PostgreSQL
#
#   networks:
#     ssbackend:
#       external: true  # already created by your main stack
#
# The Suite deliberately does NOT use `network_mode: "service:gluetun"` the way
# the dashboard did. From phase 1 it manages gluetun, and a container inside
# that namespace would sever its own connection the moment it recreated it.
# ---------------------------------------------------------------------------
