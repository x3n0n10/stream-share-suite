services:
  suite:
    build: .
    # Or use a published image once one exists:
    #   image: ghcr.io/x3n0n10/stream-share-suite:latest
    container_name: stream-share-suite
    restart: unless-stopped

    ports:
      # The UI. Change the left-hand side if 3000 is taken on your host.
      - "3000:3000"

    environment:
      PORT: 3000

      # Ownership of the data directory. The entrypoint starts as root, chowns
      # the volume to these ids, then runs the app as them — which is what makes
      # a bind-mounted directory work regardless of who owns it on the host.
      #   Unraid:            PUID=99  PGID=100   (nobody:users)
      #   Most other hosts:  PUID=1000 PGID=1000 (the default)
      PUID: 1000
      PGID: 1000

      # Where the SQLite store lives, and — from phase 2b — where every
      # component's own configuration lives too, one subfolder each. Back this
      # path up and you have backed up everything except the cache below.
      SUITE_DATA_DIR: /mnt/user/appdata/stream-share-suite

      # VOD and catchup caching, kept separate from the above because it
      # reaches tens of gigabytes per instance and usually belongs on a
      # different disk. Both variables are read once, at startup — set them
      # here and there is nothing left to configure in the Suite's own UI.
      SUITE_CACHE_DIR: /mnt/user/cache/stream-share-suite

      # Prefix for every container the Suite creates (gluetun, PostgreSQL,
      # each instance), so a fresh install never collides with anything else
      # already on the host. Only worth changing if you run more than one
      # Suite on the same Docker host — each needs a different prefix.
      # SUITE_CONTAINER_PREFIX: streamshare-suite-

      # --- First-run import (optional) -------------------------------------
      # If you are coming from stream-share-dashboard, paste its INSTANCE_N_*
      # and GLUETUN_* variables here for the first boot. They are copied into
      # the database once and then ignored forever: after the import the store
      # is the source of truth, so an env var left behind here can never
      # silently override an edit made in the UI. Once it has run, delete them.
      #
      # INSTANCE_1_NAME: "Provider 1"
      # INSTANCE_1_URL: "http://172.18.0.11:8080"
      # INSTANCE_1_API_KEY: ""
      # GLUETUN_URL: "http://172.18.0.11:8000"
      # GLUETUN_USER: "admin"
      # GLUETUN_PASSWORD: ""

      # Where to reach the Docker API. Never point this at the real socket —
      # see the docker-socket-proxy service below and the Networking note.
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375

    volumes:
      # A bind mount, not a named volume — deliberately. From phase 2b the
      # Suite bind-mounts a subfolder of this same path into every component
      # it creates (an instance's config, PostgreSQL's data directory), and a
      # bind mount is resolved by the Docker daemon on the HOST, not inside
      # this container. A named volume has no host path the Suite could hand
      # back to Docker for someone else's container — see the README's
      # "Where component data lives" section for the fuller reasoning. This is
      # also where PUID/PGID earns its keep: the entrypoint chowns this to
      # them, and every component the Suite creates runs as them too.
      - /mnt/user/appdata/stream-share-suite:/mnt/user/appdata/stream-share-suite
      # A second, separate bind mount for SUITE_CACHE_DIR above — the same
      # path-on-both-sides requirement, for the same reason.
      - /mnt/user/cache/stream-share-suite:/mnt/user/cache/stream-share-suite

    depends_on:
      - docker-socket-proxy

    networks:
      - default
      - docker-proxy-net
      - streamshare
      # - ssbackend   # see the Networking note below

  # Stands between the Suite and the real Docker socket. The Suite process
  # never touches /var/run/docker.sock — only this proxy does, and only the
  # calls the allowlist below actually permits reach it. A service that can
  # create arbitrary containers is root-equivalent on the host, so it never
  # gets unmediated access to the thing that lets it do that; see the
  # blueprint's threat-model section for the reasoning.
  #
  # Everything not explicitly granted below defaults to denied. The flags
  # here are exactly what the reconciler calls today — CONTAINERS for
  # create/inspect/start/stop/remove, NETWORKS for joining a second network
  # after creation, POST because the proxy denies every method but GET/HEAD
  # unless it's turned on, IMAGES for pulling a component's own already-
  # configured image tag (never an arbitrary one) so "release channels" can
  # tell a mutable tag apart from a stale local copy of it. IMAGES is the
  # first widening since this proxy was introduced — done for the specific
  # reconciler code that needs it, never ahead of it, same rule as always.
  #
  # The same "least privilege, deny by default" reasoning also applies to the
  # container itself, not just the API surface it exposes: pinned to a real
  # release rather than :latest (an upstream bump to a security-mediating
  # component should be a reviewed choice, not something that changes under
  # you), every Linux capability dropped (proxying HTTP to a Unix socket needs
  # none of them), and no-new-privileges (nothing in it should ever need to
  # escalate). `read_only: true` was considered too, but the proxy's own
  # changelog shows it writes to /var/lib/haproxy/server-state at startup, and
  # full read-only compatibility isn't documented upstream — worth verifying
  # locally (with a tmpfs mount for that path if it's still needed) before
  # turning it on, rather than shipping it unverified.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: stream-share-suite-docker-proxy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net
    # Deliberately no `ports:` — nothing outside docker-proxy-net can reach
    # this, including the Suite's own other networks.

networks:
  docker-proxy-net:
    internal: true
  # A real bridge network (a gateway, unlike docker-proxy-net) that gluetun,
  # PostgreSQL and every instance join by default — see each component's
  # "Docker networks to join" field. Declaring it here, once, is what lets a
  # from-scratch install work with nothing typed into that field: every
  # container the Suite creates already has somewhere to reach the others.
  # Named explicitly so the reconciler can address it by this exact string
  # regardless of the compose project's own name.
  streamshare:
    name: streamshare

# ---------------------------------------------------------------------------
# Networking
#
# As written above, the Suite is on three networks: the project's own
# `default` (published port, outbound), `docker-proxy-net` (reaching the
# socket proxy, and nothing else — it's `internal: true`), and `streamshare`
# (reaching whatever the Suite itself creates — gluetun, PostgreSQL,
# instances — which all join it by default). That's everything a from-scratch
# install needs.
#
# Bringing in instances or a database that predate the Suite is different:
# those live on your existing stack's own network, not this one. Add that
# network as a FOURTH one, external so compose doesn't try to create it, and
# point the relevant component's "Docker networks to join" field at it
# instead of (or alongside) streamshare:
#
#   services:
#     suite:
#       networks:
#         - default
#         - docker-proxy-net
#         - streamshare
#         - ssbackend   # reaching your existing gluetun and/or PostgreSQL
#
#   networks:
#     docker-proxy-net:
#       internal: true
#     streamshare:
#       name: streamshare
#     ssbackend:
#       external: true  # already created by your main stack
#
# The Suite deliberately does NOT use `network_mode: "service:gluetun"` the
# way the dashboard did. It manages gluetun, and a container inside that
# namespace would sever its own connection the moment it recreated it.
# ---------------------------------------------------------------------------
